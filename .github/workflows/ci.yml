name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor the module declares, and the current release. The SDK has
        # no dependencies, so this matrix is the whole compatibility surface.
        go: ['1.23', 'stable']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          # The SDK has no dependencies and therefore no go.sum, so there is
          # nothing for the module cache to key on.
          cache: false

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

  generator:
    # The generator is a module of its own so the SDK stays dependency-free.
    # It is built and tested here, but not run: it needs the OpenAPI
    # specification repository, which is not public.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internal/gen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          # The generator is the one module here that has a dependency.
          cache-dependency-path: internal/gen/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  api-compatibility:
    # Reports how this change affects the exported API, and what version bump
    # that implies. The answer comes from the API itself rather than from
    # commit messages: for a generated SDK the specification decides whether a
    # change is breaking, and a commit prefix is downstream of that.
    #
    # Informational — it does not fail the build. A break in v0 is allowed and
    # sometimes correct; what matters is that it is visible in the review.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # apidiff needs the tags and their history
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: go install golang.org/x/exp/cmd/apidiff@latest
      - run: scripts/apidiff.sh
